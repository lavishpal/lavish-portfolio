<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/favicon.ico" />
		<meta
			name="description"
			content="Lavish Pal — Platform Engineer, DevOps and SRE. Kubernetes, etcd, Go and open source, written up in the field notes."
		/>
		<meta property="og:image" content="/og-image.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Applied before first paint so the theme never flashes.
			try {
				var stored = localStorage.getItem("theme");
				document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
			} catch (e) {}
		</script>
		<title>Lavish Pal — Platform Engineer · DevOps · SRE</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
